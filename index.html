<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mrym & Soulefed - Espace Privé</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #2a1236, #0f172a 60%, #090d16);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .heart-anim {
      position: fixed;
      font-size: 26px;
      animation: floatUp 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      50% { opacity: 0.8; transform: translateY(-80px) scale(1.2) rotate(15deg); }
      100% { opacity: 0; transform: translateY(-160px) scale(1.5) rotate(-15deg); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .typing-dot { animation: typing 1.4s infinite ease-in-out; }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    .react-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between selection:bg-pink-500/30">

  <!-- Header Soft & Clean -->
  <header class="glass sticky top-0 z-40 px-5 py-3.5 flex justify-between items-center border-b border-white/5 shadow-lg">
    <div id="btnMedoud" class="cursor-pointer active:scale-95 transition-transform flex items-center gap-2.5 bg-gradient-to-r from-pink-500/15 via-purple-500/15 to-pink-500/15 px-4 py-1.5 rounded-full border border-pink-500/25">
      <span class="font-extrabold text-pink-300 text-base tracking-wide">medoud</span>
      <i class="fa-solid fa-heart text-pink-400 text-sm animate-pulse"></i>
    </div>
    <div id="userBadge" class="hidden text-xs font-semibold px-3.5 py-1.5 rounded-full glass border border-white/15 text-pink-200"></div>
  </header>

  <!-- Login Modal -->
  <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/85 backdrop-blur-xl">
    <div class="glass-card p-7 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-white/15">
      <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-pink-500/10 flex items-center justify-center border border-pink-500/30">
        <i class="fa-solid fa-sparkles text-pink-400 text-2xl"></i>
      </div>
      <h2 class="text-2xl font-extrabold mb-1.5 bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300 bg-clip-text text-transparent">Espace Privé</h2>
      <p class="text-gray-400 text-xs mb-6 font-medium">Sélectionnez votre profil pour entrer :</p>
      
      <div class="grid grid-cols-2 gap-3.5">
        <button id="btnSelectMrym" class="p-4 rounded-2xl glass hover:bg-pink-500/10 active:scale-95 transition-all border border-pink-500/20 flex flex-col items-center gap-2.5">
          <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-500/30 to-purple-500/30 flex items-center justify-center text-pink-300 text-xl font-black border border-pink-400/40 shadow-inner">M</div>
          <span class="font-bold text-sm text-pink-200">mrym</span>
        </button>
        <button id="btnSelectSoulefed" class="p-4 rounded-2xl glass hover:bg-purple-500/10 active:scale-95 transition-all border border-purple-500/20 flex flex-col items-center gap-2.5">
          <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-500/30 to-indigo-500/30 flex items-center justify-center text-purple-300 text-xl font-black border border-purple-400/40 shadow-inner">S</div>
          <span class="font-bold text-sm text-purple-200">Soulefed</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main App Layout -->
  <main id="appContent" class="hidden flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 flex flex-col justify-between h-[calc(100vh-65px)]">
    
    <div class="glass rounded-3xl p-3 sm:p-5 flex flex-col flex-1 overflow-hidden relative shadow-2xl">
      
      <!-- TAB CHAT -->
      <div id="tabChat" class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-3.5 p-1 sm:p-2 no-scrollbar"></div>
        
        <div id="typingIndicator" class="hidden px-2 py-1 flex items-center gap-2 text-xs text-pink-300/80 italic font-medium">
          <span id="typingUser"></span> est en train d'écrire
          <div class="flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-pink-400 rounded-full typing-dot"></span>
            <span class="w-1.5 h-1.5 bg-pink-400 rounded-full typing-dot"></span>
            <span class="w-1.5 h-1.5 bg-pink-400 rounded-full typing-dot"></span>
          </div>
        </div>

        <div id="emojiBar" class="hidden p-2 glass rounded-2xl mb-2 flex gap-3 overflow-x-auto text-xl no-scrollbar border border-white/10">
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">💖</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">✨</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">🌸</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">👑</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">🥺</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">😂</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">💌</span>
          <span class="emoji-item cursor-pointer hover:scale-125 transition-transform">🦋</span>
        </div>

        <div class="flex items-center gap-2 mt-2 pt-2 border-t border-white/10">
          <label class="p-3 rounded-full glass hover:bg-white/10 text-pink-300 cursor-pointer active:scale-90 transition-transform flex items-center justify-center">
            <i class="fa-solid fa-plus text-lg"></i>
            <input type="file" id="chatImageInput" accept="image/*" class="hidden">
          </label>

          <button id="btnEmojiToggle" class="p-3 rounded-full glass hover:bg-white/10 text-amber-300 active:scale-90 transition-transform">
            <i class="fa-solid fa-face-smile text-lg"></i>
          </button>

          <input type="text" id="msgInput" placeholder="Message secret..." class="flex-1 px-4 py-2.5 rounded-2xl glass border border-white/10 focus:outline-none focus:border-pink-400/50 text-white text-sm placeholder:text-gray-400">

          <button id="recBtn" class="p-3 rounded-full glass hover:bg-red-500/20 text-red-400 active:scale-90 transition-transform">
            <i class="fa-solid fa-microphone text-lg"></i>
          </button>

          <button id="btnSendMsg" class="p-3 px-4 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 font-bold active:scale-95 transition-transform shadow-lg shadow-pink-500/20 text-white">
            <i class="fa-solid fa-paper-plane text-sm"></i>
          </button>
        </div>
      </div>

      <!-- TAB GALLERY -->
      <div id="tabGallery" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-lg font-bold text-purple-300">Vos Souvenirs 📸</h3>
            <p class="text-[11px] text-gray-400">Photos partagées ensemble</p>
          </div>
          <label class="cursor-pointer px-4 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 font-bold text-xs transition-all shadow-lg shadow-purple-600/30 flex items-center gap-2 text-white">
            <i class="fa-solid fa-cloud-arrow-up"></i>Ajouter
            <input type="file" id="imageUploader" accept="image/*" class="hidden">
          </label>
        </div>
        <div id="galleryGrid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-3 p-1 no-scrollbar"></div>
      </div>

      <!-- TAB DATES -->
      <div id="tabDates" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <div class="mb-4">
          <h3 class="text-lg font-bold text-amber-300">Dates Importantes 🗓️</h3>
          <p class="text-[11px] text-gray-400">Moments inoubliables à ne pas oublier</p>
        </div>
        <div class="glass-card p-3 rounded-2xl mb-4 flex flex-col sm:flex-row gap-2 border border-amber-500/20">
          <input type="text" id="dateTitle" placeholder="Événement..." class="flex-1 px-3.5 py-2 rounded-xl glass border border-white/10 text-white text-xs focus:outline-none focus:border-amber-400">
          <input type="date" id="datePicker" class="px-3.5 py-2 rounded-xl glass border border-white/10 text-white text-xs focus:outline-none">
          <button id="btnAddDate" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 font-bold text-black text-xs hover:opacity-90 active:scale-95 transition-all shadow-md">Ajouter</button>
        </div>
        <div id="datesList" class="flex-1 overflow-y-auto space-y-2.5 p-1 no-scrollbar"></div>
      </div>

      <!-- TAB CHECKLIST -->
      <div id="tabTodo" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <div class="mb-4">
          <h3 class="text-lg font-bold text-emerald-300">Checklist / Projets 📝</h3>
          <p class="text-[11px] text-gray-400">Objectifs et activités prévus</p>
        </div>
        <div class="glass-card p-3 rounded-2xl mb-4 flex gap-2 border border-emerald-500/20">
          <input type="text" id="todoTitle" placeholder="Projet à réaliser ensemble..." class="flex-1 px-3.5 py-2 rounded-xl glass border border-white/10 text-white text-xs focus:outline-none focus:border-emerald-400">
          <button id="btnAddTodo" class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 font-bold text-black text-xs hover:opacity-90 active:scale-95 transition-all shadow-md">Ajouter</button>
        </div>
        <div id="todoList" class="flex-1 overflow-y-auto space-y-2.5 p-1 no-scrollbar"></div>
      </div>

    </div>

    <!-- Navigation Bar Bottom -->
    <div class="glass rounded-2xl p-2 mt-3 flex justify-around items-center border border-white/10">
      <button id="navChat" class="tab-btn flex-1 flex flex-col items-center justify-center p-2 rounded-xl text-pink-400 bg-white/10 font-semibold transition-all">
        <i class="fa-solid fa-comments text-lg"></i>
        <span class="text-[10px] mt-0.5">Messages</span>
      </button>
      <button id="navGallery" class="tab-btn flex-1 flex flex-col items-center justify-center p-2 rounded-xl text-purple-400 font-semibold transition-all">
        <i class="fa-solid fa-images text-lg"></i>
        <span class="text-[10px] mt-0.5">Galerie</span>
      </button>
      <button id="navDates" class="tab-btn flex-1 flex flex-col items-center justify-center p-2 rounded-xl text-amber-400 font-semibold transition-all">
        <i class="fa-solid fa-calendar-star text-lg"></i>
        <span class="text-[10px] mt-0.5">Dates</span>
      </button>
      <button id="navTodo" class="tab-btn flex-1 flex flex-col items-center justify-center p-2 rounded-xl text-emerald-400 font-semibold transition-all">
        <i class="fa-solid fa-list-check text-lg"></i>
        <span class="text-[10px] mt-0.5">Projets</span>
      </button>
    </div>

  </main>

  <!-- JavaScript Code -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, update, onValue, set, remove, onChildAdded, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeYfQgykcAxJX_75tQFB8N6sGrRjgTRLI",
      authDomain: "ourspace-f0378.firebaseapp.com",
      databaseURL: "https://ourspace-f0378-default-rtdb.firebaseio.com",
      projectId: "ourspace-f0378",
      storageBucket: "ourspace-f0378.firebasestorage.app",
      messagingSenderId: "996661499365",
      appId: "1:996661499365:web:c35676b1d16ae900e48b0c",
      measurementId: "G-1BM636JWTY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = "";
    let mediaRecorder, audioChunks = [];
    let typingTimeout = null;

    // --- BASE64 FILE CONVERTER (مضمون 100% لتخزين الصور والصوتيات دون مشاكل Storage Rules) ---
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    window.selectProfile = function(name) {
      currentUser = name;
      enterApp();
    };

    document.getElementById('btnSelectMrym').addEventListener('click', () => selectProfile('mrym'));
    document.getElementById('btnSelectSoulefed').addEventListener('click', () => selectProfile('Soulefed'));

    function enterApp() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');
      document.getElementById('userBadge').innerText = currentUser === 'mrym' ? '🌸 mrym' : '✨ Soulefed';
      document.getElementById('userBadge').classList.remove('hidden');
      
      listenMessages();
      listenTyping();
      listenGallery();
      listenDates();
      listenTodos();
    }

    document.getElementById('btnMedoud').addEventListener('click', (e) => {
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-anim';
        heart.innerHTML = ['💖','✨','🌸','❤️','💕'][Math.floor(Math.random()*5)];
        heart.style.left = (e.clientX + (Math.random() * 80 - 40)) + 'px';
        heart.style.top = (e.clientY + (Math.random() * 80 - 40)) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2200);
      }
    });

    function sendMessage(audioData = null, imageData = null) {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text && !audioData && !imageData) return;

      push(ref(db, 'messages_girls'), {
        sender: currentUser,
        text: text || null,
        audio: audioData || null,
        image: imageData || null,
        reaction: null,
        seen: false,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      input.value = '';
      setTypingState(false);
    }

    document.getElementById('btnSendMsg').addEventListener('click', () => sendMessage());
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('chatImageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const base64Image = await fileToBase64(file);
      sendMessage(null, base64Image);
    });

    function setTypingState(isTyping) {
      set(ref(db, `typing_${currentUser}`), isTyping);
    }

    document.getElementById('msgInput').addEventListener('input', () => {
      setTypingState(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => setTypingState(false), 2000);
    });

    function listenTyping() {
      const otherUser = currentUser === 'mrym' ? 'Soulefed' : 'mrym';
      onValue(ref(db, `typing_${otherUser}`), (snapshot) => {
        const isTyping = snapshot.val();
        const indicator = document.getElementById('typingIndicator');
        if (isTyping) {
          document.getElementById('typingUser').innerText = otherUser;
          indicator.classList.remove('hidden');
        } else {
          indicator.classList.add('hidden');
        }
      });
    }

    window.deleteMessage = function(msgKey) {
      if (confirm("Voulez-vous supprimer ce message ?")) {
        remove(ref(db, `messages_girls/${msgKey}`));
      }
    };

    window.toggleReaction = function(msgKey, currentReact) {
      const newReact = (currentReact && currentReact.trim() !== '') ? null : '❤️';
      update(ref(db, `messages_girls/${msgKey}`), { reaction: newReact });
    };

    function listenMessages() {
      onChildAdded(ref(db, 'messages_girls'), (snapshot) => {
        const msgKey = snapshot.key;
        const msg = snapshot.val();
        const box = document.getElementById('chatBox');
        const isMe = msg.sender === currentUser;

        if (!isMe && !msg.seen) {
          update(ref(db, `messages_girls/${msgKey}`), { seen: true });
        }

        const msgDiv = document.createElement('div');
        msgDiv.id = `msg-${msgKey}`;
        msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} group`;

        let innerContent = '';
        if (msg.text) innerContent = `<p class="text-sm leading-relaxed">${msg.text}</p>`;
        else if (msg.audio) innerContent = `<audio controls src="${msg.audio}" class="w-48 h-9 mt-1"></audio>`;
        else if (msg.image) innerContent = `<img src="${msg.image}" class="rounded-xl max-w-[200px] max-h-[250px] object-cover">`;

        const deleteBtn = isMe ? `
          <button onclick="deleteMessage('${msgKey}')" class="opacity-0 group-hover:opacity-100 transition-opacity text-xs text-red-400 hover:text-red-300 p-1 mr-1">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        ` : '';

        msgDiv.innerHTML = `
          <div class="flex items-center gap-1">
            ${isMe ? deleteBtn : ''}
            <span class="text-[10px] text-gray-400 mb-0.5 px-1">${msg.sender} • ${msg.time}</span>
          </div>
          <div id="bubble-${msgKey}" class="relative max-w-[80%] p-3 rounded-2xl cursor-pointer select-none ${isMe ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-br-none shadow-md' : 'glass-card text-gray-100 rounded-bl-none'}">
            ${innerContent}
            <div id="react-${msgKey}" class="absolute -bottom-2 -right-1 text-sm bg-black/70 px-1.5 py-0.5 rounded-full border border-white/20 react-pop ${msg.reaction ? '' : 'hidden'}">
              ${msg.reaction || ''}
            </div>
          </div>
          <span id="seen-${msgKey}" class="text-[9px] text-pink-300/80 mt-0.5 px-1 font-medium ${isMe ? '' : 'hidden'}">
            ${msg.seen ? 'Vu <i class="fa-solid fa-check-double text-sky-400 ml-0.5"></i>' : ''}
          </span>
        `;

        box.appendChild(msgDiv);
        box.scrollTop = box.scrollHeight;

        let currentReactionValue = msg.reaction;

        onValue(ref(db, `messages_girls/${msgKey}/reaction`), (reactSnap) => {
          currentReactionValue = reactSnap.val();
          const reactElem = document.getElementById(`react-${msgKey}`);
          if (reactElem) {
            if (currentReactionValue) {
              reactElem.innerText = currentReactionValue;
              reactElem.classList.remove('hidden');
            } else {
              reactElem.classList.add('hidden');
            }
          }
        });

        const bubble = document.getElementById(`bubble-${msgKey}`);
        let lastTap = 0;
        bubble.addEventListener('touchend', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            toggleReaction(msgKey, currentReactionValue);
            e.preventDefault();
          }
          lastTap = currentTime;
        });
        bubble.addEventListener('dblclick', () => {
          toggleReaction(msgKey, currentReactionValue);
        });

        if (isMe) {
          onValue(ref(db, `messages_girls/${msgKey}/seen`), (seenSnap) => {
            const seenElem = document.getElementById(`seen-${msgKey}`);
            if (seenElem && seenSnap.val() === true) {
              seenElem.innerHTML = 'Vu <i class="fa-solid fa-check-double text-sky-400 ml-0.5"></i>';
            }
          });
        }
      });

      onChildRemoved(ref(db, 'messages_girls'), (snapshot) => {
        const removedDiv = document.getElementById(`msg-${snapshot.key}`);
        if (removedDiv) removedDiv.remove();
      });
    }

    // --- RECORD VOICE MESSAGES ---
    document.getElementById('recBtn').addEventListener('click', async () => {
      const btn = document.getElementById('recBtn');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };
          
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const base64Audio = await fileToBase64(blob);
            sendMessage(base64Audio, null);
            stream.getTracks().forEach(track => track.stop());
          };
          
          mediaRecorder.start();
          btn.classList.add('bg-red-500', 'animate-pulse');
        } catch (err) {
          alert("Erreur: Veuillez autoriser le microphone.");
        }
      } else {
        mediaRecorder.stop();
        btn.classList.remove('bg-red-500', 'animate-pulse');
      }
    });

    document.getElementById('btnEmojiToggle').addEventListener('click', () => {
      document.getElementById('emojiBar').classList.toggle('hidden');
    });

    document.querySelectorAll('.emoji-item').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('msgInput').value += el.innerText;
      });
    });

    const tabs = ['Chat', 'Gallery', 'Dates', 'Todo'];
    tabs.forEach(tab => {
      document.getElementById(`nav${tab}`).addEventListener('click', () => {
        tabs.forEach(t => {
          document.getElementById(`tab${t}`).classList.add('hidden');
          document.getElementById(`nav${t}`).classList.remove('bg-white/10');
        });
        document.getElementById(`tab${tab}`).classList.remove('hidden');
        document.getElementById(`nav${tab}`).classList.add('bg-white/10');
      });
    });

    // --- GALERIE LISTEN & UPLOAD ---
    document.getElementById('imageUploader').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const base64Image = await fileToBase64(file);
        await push(ref(db, 'gallery_girls'), { url: base64Image, uploader: currentUser, timestamp: Date.now() });
      } catch (error) {
        alert("Erreur lors de l'envoi de l'image.");
      }
    });

    function listenGallery() {
      onValue(ref(db, 'gallery_girls'), (snapshot) => {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.keys(data).reverse().forEach(key => {
            const item = data[key];
            const imgDiv = document.createElement('div');
            imgDiv.className = 'relative group rounded-2xl overflow-hidden glass border border-white/15 aspect-square shadow-lg hover:scale-105 transition-all duration-300';
            imgDiv.innerHTML = `
              <img src="${item.url}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-2 flex flex-col justify-end">
                <span class="text-[10px] text-pink-300 font-semibold">${item.uploader || ''}</span>
              </div>
            `;
            grid.appendChild(imgDiv);
          });
        }
      });
    }

    // --- DATES ---
    document.getElementById('btnAddDate').addEventListener('click', () => {
      const title = document.getElementById('dateTitle').value.trim();
      const date = document.getElementById('datePicker').value;
      if (!title || !date) return;
      push(ref(db, 'dates_girls'), { title, date, addedBy: currentUser });
      document.getElementById('dateTitle').value = '';
    });

    window.removeDate = function(key) {
      remove(ref(db, `dates_girls/${key}`));
    };

    function listenDates() {
      onValue(ref(db, 'dates_girls'), (snapshot) => {
        const list = document.getElementById('datesList');
        list.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.keys(data).reverse().forEach(key => {
            const d = data[key];
            const item = document.createElement('div');
            item.className = 'glass-card p-3.5 rounded-2xl border border-amber-500/20 flex justify-between items-center shadow-lg hover:border-amber-500/40 transition-all';
            item.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 flex items-center justify-center border border-amber-500/30 text-amber-300 text-sm">
                  <i class="fa-solid fa-star"></i>
                </div>
                <div>
                  <h4 class="font-bold text-amber-200 text-sm">${d.title}</h4>
                  <span class="text-[10px] text-gray-400">Ajouté par ${d.addedBy}</span>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 font-mono text-xs border border-amber-500/30">${d.date}</span>
                <button onclick="removeDate('${key}')" class="text-xs text-red-400 hover:text-red-300 p-1.5"><i class="fa-solid fa-trash"></i></button>
              </div>
            `;
            list.appendChild(item);
          });
        }
      });
    }

    // --- TODOS ---
    document.getElementById('btnAddTodo').addEventListener('click', () => {
      const title = document.getElementById('todoTitle').value.trim();
      if (!title) return;
      push(ref(db, 'todos_girls'), { title, addedBy: currentUser });
      document.getElementById('todoTitle').value = '';
    });

    window.removeTodo = function(key) {
      remove(ref(db, `todos_girls/${key}`));
    };

    function listenTodos() {
      onValue(ref(db, 'todos_girls'), (snapshot) => {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.keys(data).reverse().forEach(key => {
            const t = data[key];
            const item = document.createElement('div');
            item.className = 'glass-card p-3.5 rounded-2xl border border-emerald-500/20 flex items-center justify-between shadow-lg hover:border-emerald-500/40 transition-all';
            item.innerHTML = `
              <div class="flex items-center gap-3">
                <i class="fa-regular fa-circle-check text-emerald-400 text-lg"></i>
                <div>
                  <span class="font-bold text-xs text-white block">${t.title}</span>
                  <span class="text-[9px] text-gray-400">Par ${t.addedBy}</span>
                </div>
              </div>
              <button onclick="removeTodo('${key}')" class="text-xs text-red-400 hover:text-red-300 p-1.5"><i class="fa-solid fa-trash"></i></button>
            `;
            list.appendChild(item);
          });
        }
      });
    }
  </script>
</body>
</html>
